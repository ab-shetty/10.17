<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PortJam: San Pedro Bay queue forecast</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <h1>PortJam</h1>
      <span class="sub">Ships at anchor in San Pedro Bay, forecast 1–3 days ahead</span>
      <span class="badge" title="Historical AIS data from NOAA MarineCadastre. Not a live feed.">2024 replay, not live</span>
    </div>
    <div id="tiles" class="tiles"></div>
  </header>
  <main>
    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-hud">
        <div id="clock">loading…</div>
        <div id="counts"></div>
        <div class="legend">
          <span><i style="background:var(--anch)"></i>at anchor</span>
          <span><i style="background:var(--moor)"></i>moored</span>
          <span><i style="background:var(--way)"></i>under way</span>
        </div>
      </div>
      <div class="player">
        <button id="play" title="Play / pause (space)">▶</button>
        <select id="day"></select>
        <input id="scrub" type="range" min="0" max="1439" value="0" />
        <span class="speed">1 h / s</span>
      </div>
    </section>
    <aside>
      <h2>Story mode</h2>
      <div id="episodes"></div>
      <h2>Why this forecast?</h2>
      <div id="explain" class="explain">Click a day on the chart.</div>
    </aside>
    <section class="chart-wrap">
      <div class="chart-head">
        <h2>Forecast vs actual: ships at anchor</h2>
        <div id="horizons" class="seg"></div>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </section>
  </main>
  <footer id="mocknote" hidden></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
